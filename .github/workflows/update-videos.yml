name: Atualizar vídeos do YouTube

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar feed RSS e gerar assets/videos.json
        env:
          CHANNEL_ID: UC-W2RjIEWczh8-yHcGxG-Ug
        run: python3 .github/scripts/update_videos.py assets/videos.json
      - name: Commit só se mudou
        run: |
          if git diff --quiet -- assets/videos.json; then echo "Sem alterações em assets/videos.json"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add assets/videos.json
          git commit -m "videos: atualiza assets/videos.json"
          git push
